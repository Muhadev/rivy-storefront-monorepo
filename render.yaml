# Render.com configuration for backend-only deployment
# Frontend will be deployed separately on Vercel

services:
  - type: web
    name: rivy-storefront-backend
    runtime: node
    region: oregon
    plan: starter
    branch: dev
    
    # Monorepo configuration
    rootDir: apps/backend
    
    # Build and start commands
    buildCommand: npm install && npm run build
    startCommand: npm start
    
    # Environment variables (add sensitive values via Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    
    # Health check endpoint
    healthCheckPath: /api/v1/health
    
    # Auto-deploy from GitHub
    autoDeploy: true
    
    # Disk allocation
    disk:
      name: backend-data
      mountPath: /tmp
      sizeGB: 1
