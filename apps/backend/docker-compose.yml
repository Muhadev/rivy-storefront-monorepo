services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      - NODE_ENV=${BACKEND_NODE_ENV}
      - DATABASE_URL=${BACKEND_DATABASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  db_data:
