<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing API Connection</h1>
    <div id="result"></div>
    <script>
        // Test API connection
        fetch('http://localhost:4000/api/v1/products')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<h2>API Connection Successful!</h2>' +
                    '<p>Found ' + data.products.length + ' products</p>' +
                    '<pre>' + JSON.stringify(data.products[0], null, 2) + '</pre>';
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<h2 style="color: red;">API Connection Failed</h2>' +
                    '<p>Error: ' + error.message + '</p>';
            });
    </script>
</body>
</html>
