version: '3.8'

services:
  frontend:
    image: nginx:alpine
    container_name: rivy-frontend
    ports:
      - "3000:80"
    volumes:
      # Serve pre-built static files
      - ./dist:/usr/share/nginx/html:ro
      # Use development nginx config (no backend proxy)
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - frontend-network

  # Optional: Frontend development mode (uncomment for development)
  # frontend-dev:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   container_name: rivy-frontend-dev
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_API_URL=http://host.docker.internal:4000/api
  #     - VITE_HMR_PORT=3001
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   command: npm run dev
  #   networks:
  #     - frontend-network

networks:
  frontend-network:
    driver: bridge

# Optional: Add volumes for persistent data if needed
volumes:
  frontend_node_modules:
    driver: local
