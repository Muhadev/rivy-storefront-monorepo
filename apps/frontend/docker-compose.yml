version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - rivy-network

  backend:
    image: rivy-backend:latest  # Assuming backend image exists
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    networks:
      - rivy-network

networks:
  rivy-network:
    driver: bridge

volumes:
  rivy_data: