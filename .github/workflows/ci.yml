name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm i
      - name: Install backend deps
        run: npm --workspace apps/backend i
      - name: Install frontend deps
        run: npm --workspace apps/frontend i
      - name: Lint & Build
        run: npm run build
      - name: Test
        run: npm test
